<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Transcriptor de Entrevistas</title>
<meta name="theme-color" content="#1f6f5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entrevistas">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6f5c'/%3E%3Crect x='25' y='12' width='14' height='26' rx='7' fill='%23fff'/%3E%3Cpath d='M18 32a14 14 0 0 0 28 0M32 46v7' stroke='%23fff' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231f6f5c'/%3E%3Crect x='25' y='12' width='14' height='26' rx='7' fill='%23fff'/%3E%3Cpath d='M18 32a14 14 0 0 0 28 0M32 46v7' stroke='%23fff' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: una pantalla — cabecera fina, transcripción con scroll, barra inferior para el pulgar */
:root{
  --bg:#f3f4f2; --paper:#ffffff; --ink:#1d2321; --muted:#66706b; --line:#dde1de;
  --a:#1f6f5c; --a-soft:#e2efea; --b:#8a4b14; --b-soft:#f5ebe0; --rec:#c2352b; --star:#c99a06;
  --display:"Fraunces",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151917; --paper:#1d2321; --ink:#e6ebe8; --muted:#97a19c; --line:#2f3733;
  --a:#5fbfa4; --a-soft:#1f3530; --b:#e0a466; --b-soft:#3a2b1e; --rec:#ff6b5e; --star:#f2c94c; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}

header{flex:none;display:flex;align-items:center;gap:10px;background:var(--paper);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
h1{font:600 1.1rem var(--display);margin:0;margin-right:auto;letter-spacing:-.01em}
.clock{font:500 1rem var(--mono);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.live{background:var(--rec);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
.icon{border:1px solid var(--line);background:var(--paper);border-radius:8px;width:40px;height:40px;font-size:1.2rem;line-height:1}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
.warn{background:var(--b-soft);color:var(--b);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:.9rem}
.seg{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 12px;margin-bottom:8px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.seg.A{border-left:4px solid var(--a)} .seg.B{border-left:4px solid var(--b)}
.seg.star{box-shadow:inset 0 0 0 1px var(--star)}
.head{display:flex;gap:8px;align-items:baseline;font-size:.75rem}
.who{border:0;background:none;padding:0;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem}
.A .who{color:var(--a)} .B .who{color:var(--b)}
.t{font:.75rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.acts{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;gap:4px}
.acts button{border:0;background:none;color:var(--muted);width:32px;height:32px;font-size:1.05rem;border-radius:6px}
.acts .st[aria-pressed=true]{color:var(--star)}
.txt{grid-column:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.05rem;border-radius:4px}
.txt[contenteditable=true]{background:transparent}
.txt[contenteditable=true]:focus{background:var(--bg);outline:1px solid var(--line)}
.ghost{opacity:.6;font-style:italic;border-style:dashed}
.empty{color:var(--muted);text-align:center;padding:40px 12px;line-height:1.7}
.empty b{color:var(--ink)}

.tools{flex:none;display:flex;gap:8px;justify-content:center;padding:8px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));background:var(--paper);border-top:1px solid var(--line)}
.tools button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:6px 14px;font-size:.88rem}
footer{flex:none;display:grid;grid-template-columns:1fr 76px 1fr;gap:10px;align-items:center;background:var(--paper);
  padding:10px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.spk{height:64px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:600;font-size:.95rem;padding:0 8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.spk small{display:block;font-weight:400;font-size:.7rem;color:var(--muted);letter-spacing:.04em}
.spk.A[aria-pressed=true]{background:var(--a);border-color:var(--a);color:#fff}
.spk.B[aria-pressed=true]{background:var(--b);border-color:var(--b);color:#fff}
.spk[aria-pressed=true] small{color:inherit;opacity:.85}
#rec{width:76px;height:76px;border-radius:50%;border:4px solid var(--paper);box-shadow:0 0 0 2px var(--rec);background:var(--rec);display:grid;place-items:center}
#rec i{display:block;width:26px;height:26px;border-radius:50%;background:#fff;transition:border-radius .15s}
#rec.on i{border-radius:5px;width:24px;height:24px}

dialog{border:0;border-radius:16px 16px 0 0;padding:0;margin:auto auto 0;width:100%;max-width:560px;background:var(--paper);color:var(--ink);max-height:90dvh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{padding:18px max(18px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:grid;gap:14px}
.sheet h2{font:600 1.1rem var(--display);margin:0;display:flex;justify-content:space-between;align-items:center}
.field{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:1rem;color:var(--ink);width:100%}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{width:20px;height:20px;margin-top:2px}
.check span small{display:block;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;font-weight:500}
.btn.primary{background:var(--a);border-color:var(--a);color:#fff}
.btn.danger{color:var(--rec)}
.btn:disabled{opacity:.4}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.stats b{color:var(--ink);font-weight:500}
/* guía de preguntas */
.prompt{flex:none;background:var(--paper);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right)) 4px max(16px,env(safe-area-inset-left))}
.pbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:6px}
.pbar i{display:block;height:100%;background:var(--a);width:0;transition:width .3s}
.ph{display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.ph .grow{margin-right:auto}
.chip{font-size:.68rem;padding:2px 8px;border-radius:10px;text-transform:none;letter-spacing:0;font-weight:500}
.chip:empty{display:none}
.chip.done{background:var(--a-soft);color:var(--a)} .chip.skip{background:var(--b-soft);color:var(--b)}
.mini{border:0;background:none;color:var(--muted);width:34px;height:28px;font-size:1rem}
.ptext{margin:4px 0 8px;font:600 1.12rem/1.4 var(--body);text-wrap:pretty;max-height:6.2em;overflow-y:auto}
.pacts{display:flex;gap:8px}
.pacts button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:500}
.pacts .grow{flex:1}
.pacts .go{background:var(--a);border-color:var(--a);color:#fff}
.pnext{font-size:.8rem;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnext:empty{display:none}
.prompt.collapsed .ptext{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2px;font-size:1rem}
.prompt.collapsed .pacts,.prompt.collapsed .pnext{display:none}
.qdiv{display:flex;gap:8px;align-items:baseline;margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--a);color:var(--a);font-weight:600;font-size:.92rem}
.qdiv .n{font:600 .8rem var(--mono)}
.qdiv .q{flex:1;min-width:0;overflow-wrap:anywhere}
.qdiv button{border:0;background:none;color:var(--muted);width:28px}
textarea{font:inherit;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:1rem;color:var(--ink);width:100%;resize:vertical}
.glist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.glist li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:8px}
.glist li.cur{border-color:var(--a);box-shadow:inset 0 0 0 1px var(--a)}
.glist .n{font:500 .8rem var(--mono);color:var(--muted);padding-top:7px;min-width:26px}
.glist li.done .n{color:var(--a)} .glist li.skip .n{color:var(--b)}
.glist .gt{min-width:0;padding:4px 6px;border-radius:6px;overflow-wrap:anywhere}
.glist .gt:focus{background:var(--bg);outline:1px solid var(--line)}
.glist .ga{display:grid;grid-template-columns:repeat(2,32px);gap:2px}
.glist .ga button{border:0;background:none;color:var(--muted);height:30px;border-radius:6px;font-size:1rem}
.glist .ga button:disabled{opacity:.25}
.glist .none{display:block;color:var(--muted);text-align:center;border-style:dashed}
dialog{overflow-y:auto}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:8px 16px;border-radius:20px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}#toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Entrevista</h1>
  <span class="dot" id="dot"></span>
  <span class="clock" id="clock">00:00:00</span>
  <button class="icon" id="menuBtn" aria-label="Opciones y exportar">⋯</button>
</header>

<main id="main">
  <div id="warn" class="warn" hidden></div>
  <div id="list"></div>
</main>

<section class="prompt" id="prompt" aria-live="polite">
  <div class="pbar"><i id="pBar"></i></div>
  <div class="ph"><span class="grow" id="pNum">Guía de preguntas</span><span class="chip" id="pChip"></span><button class="mini" id="pToggle" aria-label="Achicar o agrandar la guía">▾</button></div>
  <p class="ptext" id="pText"></p>
  <div class="pacts">
    <button id="pPrev" aria-label="Pregunta anterior">‹</button>
    <button id="pSkip" class="grow">Saltar</button>
    <button id="pDone" class="grow go">✓ Hecha</button>
    <button id="pRetry" class="grow" hidden>Repasar saltadas</button>
    <button id="pEdit" class="grow go" hidden>Cargar preguntas</button>
  </div>
  <div class="pnext" id="pNext"></div>
</section>
<div class="tools">
  <button id="newSeg">¶ Párrafo</button>
  <button id="markLast">★ Marcar</button>
  <button id="guideBtn">☰ Preguntas</button>
</div>
<footer>
  <button class="spk A" id="spkA" aria-pressed="true"><small>HABLA</small><span id="lblA">Entrevistador</span></button>
  <button id="rec" aria-label="Grabar"><i></i></button>
  <button class="spk B" id="spkB" aria-pressed="false"><small>HABLA</small><span id="lblB">Deportista</span></button>
</footer>

<dialog id="menu">
  <div class="sheet">
    <h2>Opciones <button class="icon" id="closeMenu" aria-label="Cerrar">✕</button></h2>
    <div class="stats">
      <span>Fecha: <b id="mDate"></b></span>
      <span>Duración: <b id="mDur">00:00:00</b></span>
      <span>Párrafos: <b id="mSeg">0</b></span>
      <span>Palabras: <b id="mWords">0</b></span>
    </div>
    <div class="grid2">
      <label class="field">Entrevistador<input id="nameA" autocomplete="off"></label>
      <label class="field">Entrevistado<input id="nameB" autocomplete="off"></label>
    </div>
    <label class="field">Idioma
      <select id="lang">
        <option value="es-AR">Español (Argentina)</option>
        <option value="es-ES">Español (España)</option>
        <option value="es-MX">Español (México)</option>
        <option value="es-US">Español (EE. UU.)</option>
        <option value="en-US">English (US)</option>
        <option value="pt-BR">Português (Brasil)</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="saveAudio"><span>Grabar audio en paralelo<small>En muchos celulares el micrófono no se puede usar para las dos cosas a la vez; si la transcripción falla, desactivalo.</small></span></label>
    <div class="grid2">
      <button class="btn primary" id="shareTxt">Compartir texto</button>
      <button class="btn" id="copyTxt">Copiar texto</button>
      <button class="btn" id="dlMd">Descargar .md</button>
      <button class="btn" id="dlAudio" disabled>Descargar audio</button>
    </div>
    <div id="confirm"><button class="btn danger" id="clear" style="width:100%">Nueva entrevista (borrar esta)</button></div>
  </div>
</dialog>
<dialog id="guideDlg">
  <div class="sheet">
    <h2>Guía de preguntas <button class="icon" id="closeGuide" aria-label="Cerrar">✕</button></h2>
    <label class="field">Escribí o pegá tus preguntas, una por línea
      <textarea id="gNew" rows="4" placeholder="¿Cómo empezaste en el deporte?&#10;¿Qué hacés el día antes de competir?"></textarea>
    </label>
    <button class="btn primary" id="gAdd">Agregar a la guía</button>
    <div class="stats"><span id="gCount"></span><span>→ mostrarla ahora · ↑↓ ordenar</span></div>
    <ol class="glist" id="gList"></ol>
    <div class="grid2">
      <button class="btn" id="gReset">Reiniciar progreso</button>
      <button class="btn danger" id="gClear">Vaciar guía</button>
    </div>
  </div>
</dialog>
<div id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const UA=navigator.userAgent;
const isIOS=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isMobile=isIOS||/Android|Mobile/i.test(UA);
const KEY='transcriptor-entrevista-movil-v1';

let state={segs:[],elapsed:0,date:new Date().toISOString(),names:{A:'Entrevistador',B:'Deportista'},lang:'es-AR'};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.segs))state=Object.assign(state,s)}catch(e){}
state.qs=state.qs||{};state.cur=state.cur||null;state.pdiv=state.pdiv||null;
const GKEY='transcriptor-guia-v1';
let guide=[];try{const g=JSON.parse(localStorage.getItem(GKEY)||'[]');if(Array.isArray(g))guide=g}catch(e){}
const saveGuide=()=>{try{localStorage.setItem(GKEY,JSON.stringify(guide))}catch(e){}};
let promptOpen=true;try{promptOpen=localStorage.getItem('transcriptor-guia-abierta')!=='0'}catch(e){}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

let speaker='A',recording=false,rec=null,startedAt=0,tick=null,forceNew=true;
let interim='',sessSpeaker='A',uttStart=null,lastFinal='',restarts=[];
let media=null,chunks=[],audioBlob=null,stream=null,wakeLock=null;

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const fmt=ms=>{const s=Math.floor(ms/1000);return[s/3600|0,(s/60|0)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':')};
const now=()=>state.elapsed+(recording?Date.now()-startedAt:0);
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('show'),1800)}
function warn(t){const w=$('warn');if(!t){w.hidden=true;return}w.textContent=t;w.hidden=false}

/* ---------- render ---------- */
function nearBottom(){const m=$('main');return m.scrollHeight-m.scrollTop-m.clientHeight<120}
function render(){
  const stick=nearBottom(),L=$('list');L.textContent='';
  if(!state.segs.length&&!interim){
    const e=document.createElement('div');e.className='empty';
    e.innerHTML='Tocá el <b>botón rojo</b> para empezar.<br>Mientras hablan, tocá <b>quién habla</b> abajo:<br>cada cambio corta el párrafo y lo asigna.<br><br>Dejá el celular entre los dos, con la pantalla encendida.';
    L.appendChild(e);
  }
  state.segs.forEach((s,i)=>{
    if(s.kind==='q'){
      const d=document.createElement('div');d.className='qdiv';
      const n=document.createElement('span');n.className='n';n.textContent='P'+s.num;
      const q=document.createElement('span');q.className='q';q.textContent=s.text;
      const t=document.createElement('span');t.className='t';t.textContent=fmt(s.t);
      const x=document.createElement('button');x.textContent='×';x.ariaLabel='Quitar separador de pregunta';
      x.onclick=()=>{state.segs.splice(i,1);save();render()};
      d.append(n,q,t,x);L.appendChild(d);return;
    }
    const d=document.createElement('div');d.className='seg '+s.who+(s.star?' star':'');
    const head=document.createElement('div');head.className='head';
    const who=document.createElement('button');who.className='who';who.textContent=state.names[s.who];who.title='Cambiar hablante';
    who.onclick=()=>{s.who=s.who==='A'?'B':'A';save();render()};
    const t=document.createElement('span');t.className='t';t.textContent=fmt(s.t);
    head.append(who,t);
    const tx=document.createElement('div');tx.className='txt';tx.textContent=s.text;
    tx.contentEditable=recording?'false':'true';tx.spellcheck=true;
    tx.oninput=()=>{s.text=tx.textContent;save()};
    const acts=document.createElement('div');acts.className='acts';
    const st=document.createElement('button');st.className='st';st.textContent='★';st.setAttribute('aria-pressed',!!s.star);st.ariaLabel='Marcar como importante';
    st.onclick=()=>{s.star=!s.star;save();render()};
    const del=document.createElement('button');del.textContent='×';del.ariaLabel='Eliminar párrafo';
    del.onclick=()=>{state.segs.splice(i,1);save();render()};
    acts.append(st,del);
    d.append(head,acts,tx);L.appendChild(d);
  });
  if(interim){
    const g=document.createElement('div');g.className='seg ghost '+sessSpeaker;
    const h=document.createElement('div');h.className='head';const w=document.createElement('span');w.className='who';w.textContent=state.names[sessSpeaker];h.appendChild(w);
    const tx=document.createElement('div');tx.className='txt';tx.textContent=interim;
    g.append(h,tx);L.appendChild(g);
  }
  if(stick&&recording)$('main').scrollTop=$('main').scrollHeight;
}
function meta(){
  $('mDate').textContent=new Date(state.date).toLocaleString('es-AR',{dateStyle:'medium',timeStyle:'short'});
  const talk=state.segs.filter(s=>s.kind!=='q');
  $('mDur').textContent=fmt(now());$('mSeg').textContent=talk.length;
  $('mWords').textContent=talk.reduce((n,s)=>n+(s.text.trim()?s.text.trim().split(/\s+/).length:0),0);
}
function labels(){$('lblA').textContent=state.names.A;$('lblB').textContent=state.names.B}

/* ---------- texto ---------- */
function addFinal(txt,who){
  txt=txt.trim();if(!txt)return;
  if(txt===lastFinal)return; // algunos Android repiten el mismo resultado final
  lastFinal=txt;
  txt=txt.charAt(0).toUpperCase()+txt.slice(1);
  const last=state.segs[state.segs.length-1];
  if(forceNew||!last||last.who!==who){
    // el separador de la pregunta va justo antes de la primera respuesta del entrevistado
    if(state.pdiv&&who==='B'){state.pdiv.t=uttStart??now();state.segs.push(state.pdiv);state.pdiv=null}
    state.segs.push({who,t:uttStart??now(),text:txt});forceNew=false;
  }
  else last.text+=(/[.?!…]$/.test(last.text)?' ':'. ')+txt;
  save();
}

/* ---------- reconocimiento ---------- */
function makeRec(){
  const r=new SR();
  r.lang=state.lang;
  r.continuous=!isMobile;       // en celulares el modo continuo duplica texto: una frase por sesión y reinicio
  r.interimResults=true;r.maxAlternatives=1;
  r.onstart=()=>{sessSpeaker=speaker;lastFinal=''};
  r.onresult=e=>{
    let fin='',tmp='';
    for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)fin+=x[0].transcript;else tmp+=x[0].transcript}
    if(uttStart===null&&(fin||tmp))uttStart=now();
    if(fin){addFinal(fin,sessSpeaker);uttStart=null;interim=''}else interim=tmp;
    render();
  };
  r.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){warn('No hay permiso de micrófono. Tocá el candado de la barra de direcciones → Permisos → Micrófono → Permitir.');stop()}
    else if(e.error==='audio-capture'){warn('El micrófono está ocupado. Si activaste “Grabar audio en paralelo”, desactivalo en ⋯.')}
    else if(e.error==='network'){warn('Sin conexión: el reconocimiento de voz del celular necesita internet.')}
  };
  r.onend=()=>{
    if(interim){addFinal(interim,sessSpeaker);interim='';uttStart=null;render()} // no perder lo que quedó a medias
    if(!recording)return;
    const t=Date.now();restarts=restarts.filter(x=>t-x<3000);restarts.push(t);
    if(restarts.length>8){warn('El reconocimiento se corta seguido. Revisá la conexión o el permiso de micrófono.')}
    setTimeout(()=>{if(recording){try{r.start()}catch(_){}}},restarts.length>8?1500:60);
  };
  return r;
}

async function lockScreen(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
async function start(){
  if(!SR){warn('Este navegador no tiene reconocimiento de voz. En Android usá Chrome; en iPhone, Safari (con Siri/Dictado activado).');return}
  warn('');recording=true;startedAt=Date.now();forceNew=true;
  $('rec').classList.add('on');$('rec').ariaLabel='Pausar';$('dot').classList.add('live');
  tick=setInterval(()=>{$('clock').textContent=fmt(now())},500);
  lockScreen();render();
  if($('saveAudio').checked&&window.MediaRecorder){
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
      media=new MediaRecorder(stream);
      media.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
      media.onstop=()=>{audioBlob=new Blob(chunks,{type:media.mimeType||'audio/webm'});$('dlAudio').disabled=false;stream.getTracks().forEach(t=>t.stop());stream=null};
      media.start(1000);
    }catch(e){toast('No se pudo grabar el audio')}
  }
  rec=rec||makeRec();
  try{rec.start()}catch(e){}
  if(navigator.vibrate)navigator.vibrate(30);
}
function stop(){
  if(!recording)return;
  recording=false;state.elapsed+=Date.now()-startedAt;clearInterval(tick);
  try{rec&&rec.stop()}catch(e){}
  if(media&&media.state!=='inactive')media.stop();
  try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null;
  $('rec').classList.remove('on');$('rec').ariaLabel='Grabar';$('dot').classList.remove('live');
  $('clock').textContent=fmt(state.elapsed);save();
  setTimeout(render,300);
}

function setSpeaker(w){
  if(w===speaker)return;
  speaker=w;forceNew=true;
  $('spkA').setAttribute('aria-pressed',w==='A');$('spkB').setAttribute('aria-pressed',w==='B');
  if(navigator.vibrate)navigator.vibrate(15);
  // cerrar la frase en curso: queda para quien hablaba; lo que sigue va al nuevo hablante
  if(recording&&rec){try{rec.stop()}catch(e){}}
}

/* ---------- exportar ---------- */
function build(md){
  meta();
  const segs=state.segs.filter(s=>s.kind==='q'||s.text.trim());
  const head=md
    ?`# Entrevista\n\n**Fecha:** ${$('mDate').textContent}  \n**Duración:** ${fmt(now())}  \n**Participantes:** ${state.names.A} (entrevistador), ${state.names.B} (entrevistado)\n\n---\n\n`
    :`ENTREVISTA\nFecha: ${$('mDate').textContent}\nDuración: ${fmt(now())}\nParticipantes: ${state.names.A} (entrevistador), ${state.names.B} (entrevistado)\n★ = momento marcado como importante\n\n`;
  let out=head+segs.map(s=>{
    if(s.kind==='q')return md?`### P${s.num}. ${s.text}`:`———— P${s.num}. ${s.text} ————`;
    const st=s.star?'★ ':'';return md?`${st}**[${fmt(s.t)}] ${state.names[s.who]}:** ${s.text.trim()}`:`${st}[${fmt(s.t)}] ${state.names[s.who]}: ${s.text.trim()}`}).join('\n\n')+'\n';
  const pend=guide.filter(q=>qStatus(q.id)!=='done');
  if(guide.length&&pend.length)out+=(md?'\n---\n\n**Preguntas no realizadas:**\n\n':'\n\nPREGUNTAS NO REALIZADAS\n')+pend.map(q=>`- ${q.text}${qStatus(q.id)==='skip'?' (saltada)':''}`).join('\n')+'\n';
  return out;
}

/* ---------- guía de preguntas ---------- */
const qStatus=id=>(state.qs[id]&&state.qs[id].st)||'pending';
function nextPending(from){
  for(let k=from+1;k<guide.length;k++)if(qStatus(guide[k].id)==='pending')return k;
  for(let k=0;k<=from&&k<guide.length;k++)if(qStatus(guide[k].id)==='pending')return k;
  return -1;
}
function curIndex(){
  let i=guide.findIndex(q=>q.id===state.cur);
  if(i<0){i=nextPending(-1);state.cur=i>=0?guide[i].id:null}
  return i;
}
function advance(i){const k=nextPending(i);state.cur=k>=0?guide[k].id:null;save();renderPrompt()}
function renderPrompt(){
  const n=guide.length,show=(id,v)=>{$(id).hidden=!v};
  $('prompt').classList.toggle('collapsed',!promptOpen);$('pToggle').textContent=promptOpen?'▾':'▴';
  const done=guide.filter(q=>qStatus(q.id)==='done').length,skip=guide.filter(q=>qStatus(q.id)==='skip').length;
  $('pBar').style.width=n?((done+skip)/n*100)+'%':'0';
  $('pChip').className='chip';$('pChip').textContent='';$('pNext').textContent='';
  if(!n){
    $('pNum').textContent='Guía de preguntas';
    $('pText').textContent='Cargá las preguntas que querés hacer y te las voy mostrando durante la entrevista.';
    ['pPrev','pSkip','pDone','pRetry'].forEach(x=>show(x,false));show('pEdit',true);return;
  }
  const i=curIndex();
  if(i<0){
    $('pNum').textContent='Guía completa';
    $('pText').textContent=`${done} hechas · ${skip} saltadas`;
    show('pPrev',true);show('pSkip',false);show('pDone',false);show('pRetry',skip>0);show('pEdit',false);return;
  }
  const q=guide[i],st=qStatus(q.id);
  $('pNum').textContent=`Pregunta ${i+1} de ${n} · ${done} hechas`;
  if(st!=='pending'){$('pChip').className='chip '+st;$('pChip').textContent=st==='done'?'Hecha':'Saltada'}
  $('pText').textContent=q.text;
  show('pPrev',true);$('pPrev').disabled=i===0;show('pSkip',true);show('pDone',true);show('pRetry',false);show('pEdit',false);
  const k=nextPending(i);
  $('pNext').textContent=k>=0&&k!==i?'Sigue: '+guide[k].text:(k===i?'':'Es la última pendiente');
}
function renderGuide(){
  const L=$('gList'),ci=curIndex();L.textContent='';
  $('gCount').textContent=guide.length?`${guide.length} preguntas`:'';
  if(!guide.length){const e=document.createElement('li');e.className='none';e.textContent='Todavía no hay preguntas.';L.appendChild(e);return}
  guide.forEach((q,i)=>{
    const st=qStatus(q.id),li=document.createElement('li');li.className=st+(i===ci?' cur':'');
    const n=document.createElement('span');n.className='n';n.textContent=(st==='done'?'✓':st==='skip'?'↷':'')+(i+1);
    const t=document.createElement('div');t.className='gt';t.contentEditable='true';t.textContent=q.text;
    t.oninput=()=>{q.text=t.textContent.trim();saveGuide();renderPrompt()};
    t.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();t.blur()}};
    const a=document.createElement('div');a.className='ga';
    const mk=(label,aria,fn,dis)=>{const b=document.createElement('button');b.textContent=label;b.ariaLabel=aria;b.disabled=!!dis;b.onclick=fn;a.appendChild(b)};
    const move=d=>{[guide[i],guide[i+d]]=[guide[i+d],guide[i]];saveGuide();renderGuide();renderPrompt()};
    mk('↑','Subir',()=>move(-1),i===0);
    mk('→','Mostrar ahora',()=>{state.cur=q.id;save();renderPrompt();$('guideDlg').close();toast('Pregunta '+(i+1))});
    mk('↓','Bajar',()=>move(1),i===guide.length-1);
    mk('×','Eliminar',()=>{guide.splice(i,1);delete state.qs[q.id];if(state.cur===q.id)state.cur=null;saveGuide();save();renderGuide();renderPrompt()});
    li.append(n,t,a);L.appendChild(li);
  });
}
function openGuide(){renderGuide();$('guideDlg').showModal()}
const stamp=()=>new Date(state.date).toISOString().slice(0,16).replace(/[:T]/g,'-');
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function shareText(){
  const text=build(false),name=`entrevista-${stamp()}.txt`;
  try{
    const f=new File([text],name,{type:'text/plain'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Entrevista'});return}
    if(navigator.share){await navigator.share({title:'Entrevista',text});return}
  }catch(e){if(e.name==='AbortError')return}
  download(new Blob([text],{type:'text/plain;charset=utf-8'}),name);
}
async function copyText(){
  try{await navigator.clipboard.writeText(build(false));toast('Transcripción copiada')}
  catch(e){toast('No se pudo copiar; usá Compartir')}
}

/* ---------- eventos ---------- */
$('rec').onclick=()=>recording?stop():start();
$('spkA').onclick=()=>setSpeaker('A');
$('spkB').onclick=()=>setSpeaker('B');
$('newSeg').onclick=()=>{forceNew=true;if(recording&&rec){try{rec.stop()}catch(e){}}toast('Párrafo nuevo')};
$('pDone').onclick=()=>{
  const i=curIndex();if(i<0)return;const q=guide[i];
  state.qs[q.id]={st:'done',t:now()};
  if(state.pdiv)state.segs.push(state.pdiv); // la anterior quedó sin respuesta transcripta
  state.pdiv={kind:'q',qid:q.id,num:i+1,text:q.text,t:now()};
  if(!recording){state.segs.push(state.pdiv);state.pdiv=null}
  setSpeaker('B');forceNew=true;advance(i);render();
  if(navigator.vibrate)navigator.vibrate(20);
};
$('pSkip').onclick=()=>{const i=curIndex();if(i<0)return;state.qs[guide[i].id]={st:'skip'};advance(i);toast('Pregunta saltada')};
$('pPrev').onclick=()=>{const i=curIndex(),j=i<0?guide.length-1:i-1;if(j>=0){state.cur=guide[j].id;save();renderPrompt()}};
$('pRetry').onclick=()=>{guide.forEach(q=>{if(qStatus(q.id)==='skip')delete state.qs[q.id]});state.cur=null;save();renderPrompt()};
$('pEdit').onclick=openGuide;
$('guideBtn').onclick=openGuide;
$('pToggle').onclick=()=>{promptOpen=!promptOpen;try{localStorage.setItem('transcriptor-guia-abierta',promptOpen?'1':'0')}catch(e){}renderPrompt()};
$('closeGuide').onclick=()=>$('guideDlg').close();
$('guideDlg').addEventListener('click',e=>{if(e.target===$('guideDlg'))$('guideDlg').close()});
$('gAdd').onclick=()=>{
  const lines=$('gNew').value.split(/\n+/).map(s=>s.replace(/^\s*(\d+\s*[.)\-:]|[-•*·])\s*/,'').trim()).filter(Boolean);
  if(!lines.length){toast('Escribí al menos una pregunta');return}
  lines.forEach(text=>guide.push({id:uid(),text}));saveGuide();$('gNew').value='';renderGuide();renderPrompt();
  toast(lines.length===1?'Pregunta agregada':lines.length+' preguntas agregadas');
};
$('gReset').onclick=()=>{state.qs={};state.cur=null;state.pdiv=null;save();renderGuide();renderPrompt();toast('Progreso reiniciado')};
let gArm=null;
$('gClear').onclick=()=>{
  if(!gArm){$('gClear').textContent='Tocá de nuevo para vaciar';gArm=setTimeout(()=>{gArm=null;$('gClear').textContent='Vaciar guía'},3000);return}
  clearTimeout(gArm);gArm=null;$('gClear').textContent='Vaciar guía';
  guide=[];state.qs={};state.cur=null;state.pdiv=null;saveGuide();save();renderGuide();renderPrompt();
};
$('markLast').onclick=()=>{const s=[...state.segs].reverse().find(x=>x.kind!=='q');if(!s){toast('Todavía no hay texto');return}s.star=true;save();render();toast('Marcado ★')};
$('menuBtn').onclick=()=>{meta();$('menu').showModal()};
$('closeMenu').onclick=()=>$('menu').close();
$('menu').addEventListener('click',e=>{if(e.target===$('menu'))$('menu').close()});
$('shareTxt').onclick=shareText;
$('copyTxt').onclick=copyText;
$('dlMd').onclick=()=>download(new Blob([build(true)],{type:'text/markdown;charset=utf-8'}),`entrevista-${stamp()}.md`);
$('dlAudio').onclick=async()=>{
  if(!audioBlob)return;
  const ext=audioBlob.type.includes('mp4')?'m4a':audioBlob.type.includes('ogg')?'ogg':'webm',name=`entrevista-${stamp()}.${ext}`;
  try{const f=new File([audioBlob],name,{type:audioBlob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
  download(audioBlob,name);
};
$('nameA').value=state.names.A;$('nameB').value=state.names.B;$('lang').value=state.lang;
$('saveAudio').checked=!isMobile;
$('nameA').oninput=e=>{state.names.A=e.target.value.trim()||'Entrevistador';save();labels();render()};
$('nameB').oninput=e=>{state.names.B=e.target.value.trim()||'Entrevistado';save();labels();render()};
$('lang').onchange=e=>{state.lang=e.target.value;save();const was=recording;if(rec){rec.onend=null;try{rec.abort()}catch(_){}}rec=null;if(was){rec=makeRec();try{rec.start()}catch(_){}}};
function askClear(){
  const c=$('confirm');
  c.innerHTML='<div class="grid2"><button class="btn danger" id="yes">Sí, borrar todo</button><button class="btn" id="no">Cancelar</button></div>';
  const reset=()=>{c.innerHTML='<button class="btn danger" id="clear" style="width:100%">Nueva entrevista (borrar esta)</button>';$('clear').onclick=askClear};
  $('no').onclick=reset;
  $('yes').onclick=()=>{stop();state={segs:[],elapsed:0,date:new Date().toISOString(),names:state.names,lang:state.lang,qs:{},cur:null,pdiv:null};renderPrompt();
    chunks=[];audioBlob=null;$('dlAudio').disabled=true;$('clock').textContent='00:00:00';save();render();meta();reset();$('menu').close();toast('Lista para una nueva entrevista')};
}
$('clear').onclick=askClear;

document.addEventListener('visibilitychange',()=>{
  if(!recording)return;
  if(document.visibilityState==='hidden'){save()}
  else{lockScreen();try{rec.start()}catch(e){}warn('Si salís del navegador o se apaga la pantalla, el celular deja de escuchar. Ya retomé la transcripción.')}
});
window.addEventListener('pagehide',save);

if(!SR)warn('Este navegador no tiene reconocimiento de voz. En Android usá Chrome; en iPhone, Safari (con Siri/Dictado activado en Ajustes).');
else if(location.protocol==='file:'&&isMobile)warn('Abriste el archivo localmente: en el celular el micrófono solo funciona si la página está publicada en una dirección https://.');
labels();$('clock').textContent=fmt(state.elapsed);render();renderPrompt();
</script>
